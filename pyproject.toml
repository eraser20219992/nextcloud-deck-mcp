[project]
name = "deck-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent read and solve tasks from a Nextcloud Deck board"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
deck-mcp = "deck_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
